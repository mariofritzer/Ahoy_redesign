name: Build Redesign Firmware

on:
  push:
    branches:
      - main
      - 'redesign*'
      - modern-ui
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - esp32-wroom32-de
          - esp32-wroom32
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('src/platformio.ini') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install setuptools --upgrade pip
          pip install --upgrade platformio

      - name: Build
        run: pio run -d src -e ${{ matrix.variant }} | tee build.log

      - name: Check size and collect firmware
        run: |
          mkdir -p out
          # name like the official builds: <date>_ahoy_<version>_<sha>_<env>.bin (the update page parses it)
          V=$(grep -E "#define VERSION_(MAJOR|MINOR|PATCH)" src/defines.h | awk '{print $3}' | paste -sd.)
          BIN=out/$(date -u +%y%m%d)_ahoy_${V}_$(git rev-parse --short HEAD)_${{ matrix.variant }}.bin
          cp src/.pio/build/${{ matrix.variant }}/firmware.bin $BIN
          SIZE=$(stat -c %s "$BIN")
          # OTA limit of the running Ahoy firmware: Update.begin((FreeSketchSpace - 0x1000) & 0xFFFFF000)
          # app partition of the lolin_d32 default table is 0x140000 -> 0x13F000 = 1306624 bytes
          MAX=1306624
          PCT=$(( SIZE * 100 / MAX ))
          FLASH=$(grep -E "^(RAM|Flash):" build.log | tr '\n' ' ')
          echo "::notice title=${{ matrix.variant }}::firmware.bin ${SIZE} of ${MAX} bytes (${PCT}%) | ${FLASH}"
          echo "### ${{ matrix.variant }}: ${SIZE} / ${MAX} Bytes (${PCT} %)" >> $GITHUB_STEP_SUMMARY
          if [ $SIZE -gt $MAX ]; then echo "::error::firmware too large for OTA update (${SIZE} > ${MAX})"; exit 1; fi
          if [ $SIZE -gt $(( MAX - 8192 )) ]; then echo "::error::less than 8 KB OTA reserve (${SIZE} of ${MAX})"; exit 1; fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out/*.bin

  release:
    name: Publish download
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'modern-ui' || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=redesign-latest
          SHA=$(git rev-parse --short HEAD)
          NOTES="Automatischer Build vom Branch ${{ github.ref_name }} (Commit ${SHA}, $(date -u +'%Y-%m-%d %H:%M UTC')).

          Für das OTA-Update in der Ahoy-Weboberfläche unter Update die passende Datei hochladen:
          - ..._esp32-wroom32-de.bin  (deutsche Oberfläche)
          - ..._esp32-wroom32.bin     (englische Oberfläche)"
          gh release delete $TAG --yes --cleanup-tag 2>/dev/null || true
          gh release create $TAG out/*.bin --prerelease --target ${{ github.sha }} --title "Ahoy Redesign (${SHA})" --notes "$NOTES"
