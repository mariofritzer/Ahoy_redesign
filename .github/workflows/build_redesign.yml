name: Build Redesign Firmware

on:
  push:
    branches:
      - main
      - 'redesign*'
      - modern-ui
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - esp32-wroom32-de
          - esp32-wroom32
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('src/platformio.ini') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install setuptools --upgrade pip
          pip install --upgrade platformio

      - name: Build
        run: pio run -d src -e ${{ matrix.variant }}

      - name: Collect firmware
        run: |
          mkdir -p out
          cp src/.pio/build/${{ matrix.variant }}/firmware.bin out/firmware_${{ matrix.variant }}_OTA.bin
          ls -la out
          SIZE=$(stat -c %s out/firmware_${{ matrix.variant }}_OTA.bin)
          echo "### ${{ matrix.variant }}: $SIZE Bytes" >> $GITHUB_STEP_SUMMARY

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out/*.bin
